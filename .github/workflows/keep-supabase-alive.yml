name: Keep Supabase Alive

on:
  schedule:
    # Cada 3 días a las 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Para poder ejecutarlo manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          echo "Código de respuesta: $response"
          
          if [ "$response" -ge 200 ] && [ "$response" -lt 400 ]; then
            echo "✅ Ping exitoso - Proyecto activo"
          else
            echo "❌ Error en el ping (código $response)"
            exit 1
          fi
