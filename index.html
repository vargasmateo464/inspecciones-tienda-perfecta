<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Check List de Inspección de Seguridad</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

.app {
    max-width: 720px;
    margin: auto;
    min-height: 100vh;
    background: white;
    box-shadow: 0 0 20px rgba(0,0,0,.08);
}

header {
    background: #1f2937;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

.contenido {
    padding: 20px;
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    font-weight: bold;
    margin: 14px 0 6px;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.btn-principal {
    background: #2563eb;
    color: white;
}

.btn-principal:hover {
    background: #1d4ed8;
}

.btn-secundario {
    background: #e5e7eb;
    color: #111827;
}

.btn-ticket {
    background: #111827;
    color: white;
    margin-top: 15px;
}

.estados {
    display: grid;
    gap: 10px;
    margin-top: 18px;
}

.estado {
    padding: 17px;
    border: 2px solid #ddd;
    border-radius: 10px;
    background: white;
    font-size: 17px;
    font-weight: bold;
}

.estado.seleccionado {
    border-color: #2563eb;
    background: #eff6ff;
}

.contador {
    text-align: center;
    color: #666;
    margin-bottom: 10px;
}

.parametro {
    font-size: 20px;
    font-weight: bold;
    line-height: 1.4;
    margin: 20px 0;
}

.ticket {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 14px;
    margin-top: 12px;
    background: #fafafa;
}

.ticket strong {
    display: block;
    margin-bottom: 5px;
}

.ticket p {
    margin: 6px 0;
}

.oculto {
    display: none !important;
}

.acciones {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 20px;
}

.estado-conexion {
    text-align: center;
    font-size: 13px;
    color: #666;
    margin-top: 10px;
}

.mensaje {
    padding: 15px;
    border-radius: 8px;
    margin-top: 15px;
    background: #ecfdf5;
    color: #065f46;
}

hr {
    border: 0;
    border-top: 1px solid #ddd;
    margin: 20px 0;
}
</style>
</head>

<body>

<div class="app">

<header>
    <h1>CHECK LIST DE INSPECCIÓN DE SEGURIDAD</h1>
</header>

<div class="contenido">

<!-- =====================================================
     PANTALLA INICIAL
===================================================== -->

<section id="pantallaInicio">

    <h2>Nueva inspección</h2>

    <label for="fechaInspeccion">
        Fecha de inspección
    </label>

    <input
        type="date"
        id="fechaInspeccion"
    >

    <label for="horaInspeccion">
        Hora de inspección
    </label>

    <input
        type="time"
        id="horaInspeccion"
    >

    <label for="bodega">
        Bodega
    </label>

    <input
        type="text"
        id="bodega"
        placeholder="Ingrese la bodega"
    >

    <label for="inspector">
        Nombre del inspector
    </label>

    <input
        type="text"
        id="inspector"
        placeholder="Ingrese el nombre del inspector"
    >

    <label for="regente">
        Nombre del regente o encargado del área
    </label>

    <input
        type="text"
        id="regente"
        placeholder="Ingrese el nombre del regente o encargado"
    >

    <button
        type="button"
        class="btn-principal"
        id="btnIniciar"
        style="margin-top:20px;"
    >
        INICIAR INSPECCIÓN
    </button>

    <div
        id="estadoConexion"
        class="estado-conexion"
    >
        Conectando con la base de datos...
    </div>

</section>


<!-- =====================================================
     PANTALLA DE PARÁMETROS
===================================================== -->

<section
    id="pantallaParametros"
    class="oculto"
>

    <div
        id="contador"
        class="contador"
    ></div>

    <div
        id="nombreParametro"
        class="parametro"
    ></div>


    <!-- ESTADOS -->

    <div class="estados">

        <button
            type="button"
            class="estado"
            id="btnCumple"
        >
            🟢 CUMPLE
        </button>

        <button
            type="button"
            class="estado"
            id="btnNoCumple"
        >
            🔴 NO CUMPLE
        </button>

        <button
            type="button"
            class="estado"
            id="btnNoAplica"
        >
            🟡 NO APLICA
        </button>

    </div>


    <!-- TICKET -->

    <button
        type="button"
        class="btn-ticket"
        id="btnAgregarTicket"
    >
        + AGREGAR TICKET
    </button>


    <div id="listaTickets"></div>


    <!-- FORMULARIO TICKET -->

    <div
        id="formularioTicket"
        class="oculto"
    >

        <hr>

        <h3>
            Nuevo ticket
        </h3>

        <label for="ticketObservacion">
            Observación
        </label>

        <select id="ticketObservacion">

            <option value="">
                Seleccione una observación
            </option>

        </select>


        <label for="ticketDescripcion">
            Descripción
        </label>

        <textarea
            id="ticketDescripcion"
            placeholder="Escriba la descripción del ticket"
        ></textarea>


        <label for="ticketNumero">
            Número de ticket
        </label>

        <input
            type="text"
            id="ticketNumero"
            placeholder="Ejemplo: STT-36816"
        >


        <label for="ticketFecha">
            Fecha de solicitud
        </label>

        <input
            type="date"
            id="ticketFecha"
        >


        <button
            type="button"
            class="btn-principal"
            id="btnGuardarTicket"
            style="margin-top:15px;"
        >
            GUARDAR TICKET
        </button>


        <button
            type="button"
            class="btn-secundario"
            id="btnCancelarTicket"
            style="margin-top:8px;"
        >
            CANCELAR
        </button>

    </div>


    <!-- NAVEGACIÓN -->

    <div class="acciones">

        <button
            type="button"
            class="btn-secundario"
            id="btnAnterior"
        >
            ← ANTERIOR
        </button>

        <button
            type="button"
            class="btn-principal"
            id="btnSiguiente"
        >
            SIGUIENTE →
        </button>

    </div>

</section>


<!-- =====================================================
     PANTALLA FINAL
===================================================== -->

<section
    id="pantallaFinal"
    class="oculto"
>

    <h2>
        Inspección terminada
    </h2>

    <div class="mensaje">

        La inspección fue guardada correctamente
        en la base de datos.

    </div>

    <button
        type="button"
        class="btn-principal"
        id="btnNuevaInspeccion"
        style="margin-top:20px;"
    >
        NUEVA INSPECCIÓN
    </button>

</section>

</div>
</div>


<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";


/* =====================================================
   CONFIGURACIÓN SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://yexzuexynewloljdaxme.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_xCwUcWg4FoZ57UCw91KCLg_3HPv5kPs";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


window.supabaseClient =
    supabaseClient;


/* =====================================================
   PARÁMETROS DE RESPALDO
===================================================== */

const parametrosRespaldo = [

    "Letreros luminosos en funcionamiento, visibles y sin obstáculos",

    "Sistema Din-Dong",

    "Pantalla TV check-out",

    "CCTV operando y con adecuada cobertura",

    "Sistema de alarma y botones de pánico operando",

    "Parqueo expedito",

    "Cerraduras en funcionamiento",

    "Acera despejada y limpia",

    "Entorno iluminado y seguro",

    "Puertas y cortinas operando",

    "Anclaje zona botiquín",

    "Anclaje cajas registradoras",

    "Orden y limpieza",

    "Señalética visible y clara",

    "Extintores",

    "Basureros",

    "Procedimientos Generales de la Corporación"

];


/* =====================================================
   VARIABLES
===================================================== */

let parametros = [];

let indiceParametro = 0;

let estadoActual = null;

let idInspeccion = null;


let inspeccion = {

    fecha: "",

    hora: "",

    bodega: "",

    inspector: "",

    regente: "",

    resultados: [],

    tickets: []

};


/* =====================================================
   FUNCIONES AUXILIARES
===================================================== */

function obtener(id) {

    return document.getElementById(id);

}


function fechaHoy() {

    return new Date()
        .toISOString()
        .split("T")[0];

}


function horaActual() {

    return new Date()
        .toTimeString()
        .slice(0,5);

}


function escaparHTML(texto) {

    return String(texto)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =====================================================
   FECHA Y HORA AUTOMÁTICAS
===================================================== */

obtener("fechaInspeccion").value =
    fechaHoy();

obtener("horaInspeccion").value =
    horaActual();

obtener("ticketFecha").value =
    fechaHoy();


/* =====================================================
   CARGAR PARÁMETROS
===================================================== */

async function cargarParametros() {

    const estado =
        obtener("estadoConexion");

    try {

        const { data, error } =
            await supabaseClient

                .from("parametros")

                .select(
                    "parametro, orden, activo"
                )

                .eq(
                    "activo",
                    true
                )

                .order(
                    "orden"
                );


        if (error) {

            console.error(
                "ERROR PARÁMETROS:",
                error
            );

            parametros =
                parametrosRespaldo.slice();

            estado.innerText =
                "⚠️ Se utilizará la lista de respaldo.";

            return;

        }


        parametros =
            (data || [])

                .map(
                    x => x.parametro
                )

                .filter(Boolean);


        if (
            parametros.length === 0
        ) {

            parametros =
                parametrosRespaldo.slice();

            estado.innerText =
                "⚠️ La tabla parámetros está vacía.";

            return;

        }


        estado.innerText =
            "✓ Conectado a Supabase";


        console.log(
            "PARÁMETROS:",
            parametros
        );


    } catch (error) {

        console.error(error);

        parametros =
            parametrosRespaldo.slice();

        estado.innerText =
            "⚠️ Error de conexión. Se utilizará la lista de respaldo.";

    }

}


/* =====================================================
   INICIAR INSPECCIÓN
===================================================== */

async function iniciarInspeccion() {

    const fecha =
        obtener(
            "fechaInspeccion"
        ).value;


    const hora =
        obtener(
            "horaInspeccion"
        ).value;


    const bodega =
        obtener(
            "bodega"
        ).value.trim();


    const inspector =
        obtener(
            "inspector"
        ).value.trim();


    const regente =
        obtener(
            "regente"
        ).value.trim();


    if (!fecha) {

        alert(
            "Ingrese la fecha de inspección."
        );

        return;

    }


    if (!hora) {

        alert(
            "Ingrese la hora de inspección."
        );

        return;

    }


    if (!bodega) {

        alert(
            "Ingrese la bodega."
        );

        return;

    }


    if (!inspector) {

        alert(
            "Ingrese el nombre del inspector."
        );

        return;

    }


    if (!regente) {

        alert(
            "Ingrese el nombre del regente o encargado del área."
        );

        return;

    }


    if (
        parametros.length === 0
    ) {

        alert(
            "Todavía no se han cargado los parámetros."
        );

        return;

    }


    const boton =
        obtener("btnIniciar");


    boton.disabled = true;

    boton.innerText =
        "GUARDANDO INSPECCIÓN...";


    try {

        const { data, error } =

            await supabaseClient

                .from("inspecciones")

                .insert({

                    fecha: fecha,

                    hora: hora,

                    bodega: bodega,

                    inspector: inspector,

                    regente: regente

                })

                .select("id")

                .single();


        if (error) {

            console.error(
                "ERROR INSPECCIÓN:",
                error
            );


            alert(
                "No se pudo crear la inspección:\n\n" +
                error.message
            );


            boton.disabled = false;

            boton.innerText =
                "INICIAR INSPECCIÓN";

            return;

        }


        idInspeccion =
            data.id;


        console.log(
            "ID INSPECCIÓN:",
            idInspeccion
        );


        inspeccion = {

            fecha: fecha,

            hora: hora,

            bodega: bodega,

            inspector: inspector,

            regente: regente,

            resultados: [],

            tickets: []

        };


        indiceParametro = 0;

        estadoActual = null;


        obtener(
            "pantallaInicio"
        ).classList.add(
            "oculto"
        );


        obtener(
            "pantallaParametros"
        ).classList.remove(
            "oculto"
        );


        mostrarParametro();


    } catch (error) {

        console.error(error);

        alert(
            "Ocurrió un error al iniciar la inspección."
        );


        boton.disabled = false;

        boton.innerText =
            "INICIAR INSPECCIÓN";

    }

}


/* =====================================================
   MOSTRAR PARÁMETRO
===================================================== */

function mostrarParametro() {

    if (
        parametros.length === 0
    ) {

        return;

    }


    const parametro =
        parametros[
            indiceParametro
        ];


    obtener(
        "contador"
    ).innerText =

        "PARÁMETRO " +

        (
            indiceParametro + 1
        ) +

        " DE " +

        parametros.length;


    obtener(
        "nombreParametro"
    ).innerText =
        parametro;


    const resultado =

        inspeccion.resultados.find(

            r =>
                r.parametro ===
                parametro

        );


    estadoActual =

        resultado
            ? resultado.estado
            : null;


    actualizarBotones();

    mostrarTickets();

    ocultarFormularioTicket();

}


/* =====================================================
   SELECCIONAR ESTADO
===================================================== */

function seleccionarEstado(
    estado
) {

    estadoActual =
        estado;


    const parametro =
        parametros[
            indiceParametro
        ];


    const existente =

        inspeccion.resultados.find(

            r =>
                r.parametro ===
                parametro

        );


    if (existente) {

        existente.estado =
            estado;

    } else {

        inspeccion.resultados.push({

            parametro:
                parametro,

            estado:
                estado

        });

    }


    actualizarBotones();

}


/* =====================================================
   ACTUALIZAR BOTONES
===================================================== */

function actualizarBotones() {

    obtener(
        "btnCumple"
    ).classList.remove(
        "seleccionado"
    );


    obtener(
        "btnNoCumple"
    ).classList.remove(
        "seleccionado"
    );


    obtener(
        "btnNoAplica"
    ).classList.remove(
        "seleccionado"
    );


    if (
        estadoActual ===
        "Cumple"
    ) {

        obtener(
            "btnCumple"
        ).classList.add(
            "seleccionado"
        );

    }


    if (
        estadoActual ===
        "No Cumple"
    ) {

        obtener(
            "btnNoCumple"
        ).classList.add(
            "seleccionado"
        );

    }


    if (
        estadoActual ===
        "No Aplica"
    ) {

        obtener(
            "btnNoAplica"
        ).classList.add(
            "seleccionado"
        );

    }

}


/* =====================================================
   SIGUIENTE
===================================================== */

async function siguienteParametro() {

    if (!estadoActual) {

        alert(
            "Seleccione el estado del parámetro."
        );

        return;

    }


    if (
        indiceParametro <
        parametros.length - 1
    ) {

        indiceParametro++;

        mostrarParametro();

    } else {

        await finalizarInspeccion();

    }

}


/* =====================================================
   ANTERIOR
===================================================== */

function anteriorParametro() {

    if (
        indiceParametro > 0
    ) {

        indiceParametro--;

        mostrarParametro();

    }

}


/* =====================================================
   FORMULARIO TICKET
===================================================== */

function mostrarFormularioTicket() {

    cargarObservaciones();


    obtener(
        "ticketFecha"
    ).value =
        fechaHoy();


    obtener(
        "formularioTicket"
    ).classList.remove(
        "oculto"
    );

}


function ocultarFormularioTicket() {

    obtener(
        "formularioTicket"
    ).classList.add(
        "oculto"
    );

}


/* =====================================================
   OBSERVACIONES
===================================================== */

function cargarObservaciones() {

    const select =
        obtener(
            "ticketObservacion"
        );


    select.innerHTML =
        '<option value="">Seleccione una observación</option>';


    parametros.forEach(
        parametro => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                parametro;


            option.textContent =
                parametro;


            select.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   GUARDAR TICKET LOCALMENTE
===================================================== */

function guardarTicket() {

    const observacion =
        obtener(
            "ticketObservacion"
        ).value;


    const descripcion =
        obtener(
            "ticketDescripcion"
        ).value.trim();


    const numero =
        obtener(
            "ticketNumero"
        ).value.trim();


    const fecha =
        obtener(
            "ticketFecha"
        ).value;


    if (!observacion) {

        alert(
            "Seleccione la observación."
        );

        return;

    }


    if (!descripcion) {

        alert(
            "Ingrese la descripción."
        );

        return;

    }


    if (!numero) {

        alert(
            "Ingrese el número de ticket."
        );

        return;

    }


    if (!fecha) {

        alert(
            "Ingrese la fecha de solicitud."
        );

        return;

    }


    inspeccion.tickets.push({

        parametro:
            parametros[
                indiceParametro
            ],

        observacion:
            observacion,

        descripcion:
            descripcion,

        numero_ticket:
            numero,

        fecha_solicitud:
            fecha

    });


    obtener(
        "ticketObservacion"
    ).value = "";


    obtener(
        "ticketDescripcion"
    ).value = "";


    obtener(
        "ticketNumero"
    ).value = "";


    ocultarFormularioTicket();

    mostrarTickets();

}


/* =====================================================
   MOSTRAR TICKETS
===================================================== */

function mostrarTickets() {

    const contenedor =
        obtener(
            "listaTickets"
        );


    contenedor.innerHTML =
        "";


    const parametroActual =
        parametros[
            indiceParametro
        ];


    const tickets =

        inspeccion.tickets.filter(

            ticket =>

                ticket.parametro ===
                parametroActual

        );


    if (
        tickets.length === 0
    ) {

        contenedor.innerHTML =
            "<p>No hay tickets registrados para este parámetro.</p>";

        return;

    }


    tickets.forEach(
        ticket => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "ticket";


            div.innerHTML = `

                <strong>
                    Ticket:
                    ${escaparHTML(
                        ticket.numero_ticket
                    )}
                </strong>

                <p>
                    <b>Observación:</b>
                    ${escaparHTML(
                        ticket.observacion
                    )}
                </p>

                <p>
                    <b>Descripción:</b>
                    ${escaparHTML(
                        ticket.descripcion
                    )}
                </p>

                <p>
                    <b>Fecha:</b>
                    ${escaparHTML(
                        ticket.fecha_solicitud
                    )}
                </p>

            `;


            contenedor.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   FINALIZAR INSPECCIÓN
===================================================== */

async function finalizarInspeccion() {

    if (!idInspeccion) {

        alert(
            "No existe el ID de la inspección."
        );

        return;

    }


    if (
        inspeccion.resultados.length !==
        parametros.length
    ) {

        alert(
            "Hay parámetros sin estado seleccionado."
        );

        return;

    }


    const boton =
        obtener(
            "btnSiguiente"
        );


    boton.disabled = true;

    boton.innerText =
        "GUARDANDO...";


    try {


        /* ==========================================
           GUARDAR RESULTADOS
        ========================================== */

        const filasResultados =

            inspeccion.resultados.map(

                resultado => ({

                    id_inspeccion:
                        idInspeccion,

                    parametro:
                        resultado.parametro,

                    estado:
                        resultado.estado

                })

            );


        const {
            error: errorResultados
        } =

            await supabaseClient

                .from(
                    "resultados"
                )

                .insert(
                    filasResultados
                );


        if (
            errorResultados
        ) {

            console.error(
                errorResultados
            );


            alert(
                "La inspección se guardó, pero fallaron los resultados:\n\n" +
                errorResultados.message
            );


            boton.disabled = false;

            boton.innerText =
                "SIGUIENTE →";

            return;

        }


        /* ==========================================
           GUARDAR TICKETS
        ========================================== */

        if (
            inspeccion.tickets.length > 0
        ) {


            const filasTickets =

                inspeccion.tickets.map(

                    ticket => ({

                        id_inspeccion:
                            idInspeccion,

                        parametro:
                            ticket.parametro,

                        observacion:
                            ticket.observacion,

                        descripcion:
                            ticket.descripcion,

                        numero_ticket:
                            ticket.numero_ticket,

                        fecha_solicitud:
                            ticket.fecha_solicitud

                    })

                );


            const {
                error: errorTickets
            } =

                await supabaseClient

                    .from(
                        "tickets"
                    )

                    .insert(
                        filasTickets
                    );


            if (
                errorTickets
            ) {

                console.error(
                    errorTickets
                );


                alert(
                    "Los resultados se guardaron, pero fallaron los tickets:\n\n" +
                    errorTickets.message
                );


                boton.disabled = false;

                boton.innerText =
                    "SIGUIENTE →";

                return;

            }

        }


        /* ==========================================
           FINAL CORRECTO
        ========================================== */

        console.log(
            "INSPECCIÓN GUARDADA"
        );


        console.log(
            "ID:",
            idInspeccion
        );


        console.log(
            "RESULTADOS:",
            filasResultados
        );


        console.log(
            "TICKETS:",
            inspeccion.tickets
        );


        obtener(
            "pantallaParametros"
        ).classList.add(
            "oculto"
        );


        obtener(
            "pantallaFinal"
        ).classList.remove(
            "oculto"
        );


    } catch (error) {

        console.error(
            "ERROR GENERAL:",
            error
        );


        alert(
            "Ocurrió un error al guardar la inspección:\n\n" +
            error.message
        );


        boton.disabled = false;

        boton.innerText =
            "SIGUIENTE →";

    }

}
