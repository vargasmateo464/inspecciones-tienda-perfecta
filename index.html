<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspección de Sucursales</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #004085; }
        .campo { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input[type="text"], input[type="file"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; background-color: #28a745; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn:hover { background-color: #218838; }
        .parametro-card { border: 1px solid #e0e0e0; padding: 15px; border-radius: 6px; margin-bottom: 15px; background: #fafafa; }
        .parametro-titulo { font-weight: bold; font-size: 1.05em; color: #155724; margin-bottom: 10px; }
        #mensaje { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Formulario de Inspección</h2>

    <form id="formInspeccion">
        <!-- CABECERA DE INSPECCIÓN -->
        <div class="campo">
            <label for="bodega">Código de Bodega / Sucursal:</label>
            <input type="text" id="bodega" placeholder="Ej: B001 o SANTA CRUZ" required>
        </div>

        <hr style="margin: 25px 0;">

        <h3>Parámetros a Evaluar</h3>

        <!-- LISTADO DE PARÁMETROS -->
        <div id="contenedorParametros"></div>

        <button type="submit" class="btn" id="btnGuardar">Finalizar e Imprimir Informe</button>
    </form>

    <div id="mensaje"></div>
</div>

<script>
    // -------------------------------------------------------------
    // 1. CONFIGURACIÓN DE SUPABASE (REEMPLAZA CON TUS DATOS)
    // -------------------------------------------------------------
    const SUPABASE_URL = "https://ncnoavdugmmthipnymbq.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jbm9hdmR1Z21tdGhpcG55bWJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODYwNjksImV4cCI6MjEwMjY2MjA2OX0.WAAy6pq7CGncaDOaZdYgi9vn8JwKv8jdVs3glIPUnMc"; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // URL de la llamada HTTP de Power Automate (lo configurarás más adelante)
    const POWER_AUTOMATE_WEBHOOK_URL = "AQUI_VA_TU_URL_DE_POWER_AUTOMATE";

    // -------------------------------------------------------------
    // 2. LISTA DE PARÁMETROS DE INSPECCIÓN
    // -------------------------------------------------------------
    const parametros = [
        "Letreros luminosos en funcionamiento, visibles y sin obstáculos",
        "Sistema Din-Dong",
        "Pantalla TV check-out",
        "CCTV operando y con adecuada cobertura",
        "Sistema de alarma y botones de pánico operando",
        "Parqueo expedito",
        "Cerraduras en funcionamiento",
        "Acera despejada y limpia",
        "Entorno iluminado y seguro",
        "Puertas y cortinas operando",
        "Anclaje zona botiquín",
        "Anclaje cajas registradoras",
        "Orden y limpieza",
        "Señalética visible y clara",
        "Extintores",
        "Basureros",
        "Procedimientos Generales de la Corporación"
    ];

    // -------------------------------------------------------------
    // 3. RENDERIZAR PARÁMETROS EN EL HTML
    // -------------------------------------------------------------
    const contenedor = document.getElementById("contenedorParametros");

    parametros.forEach((param, index) => {
        const div = document.createElement("div");
        div.className = "parametro-card";
        div.innerHTML = `
            <div class="parametro-titulo">${index + 1}. ${param}</div>
            
            <div class="campo">
                <label>Estado:</label>
                <select id="estado_${index}" required>
                    <option value="">-- Seleccionar --</option>
                    <option value="CUMPLE">CUMPLE</option>
                    <option value="NO CUMPLE">NO CUMPLE</option>
                    <option value="NO APLICA">NO APLICA</option>
                </select>
            </div>

            <div class="campo">
                <label>📸 Foto opcional:</label>
                <input type="file" id="foto_${index}" accept="image/*">
            </div>
        `;
        contenedor.appendChild(div);
    });

    // -------------------------------------------------------------
    // 4. FUNCIÓN PARA SUBIR FOTO A SUPABASE STORAGE
    // -------------------------------------------------------------
    async function subirFoto(fileInput, inspeccionId, index) {
        const file = fileInput.files[0];
        if (!file) return null; // Si no seleccionó foto, retorna null

        const ext = file.name.split('.').pop();
        const nombreArchivo = `insp_${inspeccionId}_p${index}_${Date.now()}.${ext}`;
        const rutaArchivo = `fotos/${nombreArchivo}`;

        const { data, error } = await supabaseClient
            .storage
            .from('fotos-inspecciones')
            .upload(rutaArchivo, file);

        if (error) {
            console.error(`Error al subir la foto del parámetro ${index}:`, error.message);
            return null;
        }

        const { data: dataUrl } = supabaseClient
            .storage
            .from('fotos-inspecciones')
            .getPublicUrl(rutaArchivo);

        return dataUrl.publicUrl;
    }

    // -------------------------------------------------------------
    // 5. PROCESAR Y GUARDAR INSPECCIÓN COMPLETA
    // -------------------------------------------------------------
    document.getElementById("formInspeccion").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById("btnGuardar");
        const mensajeDiv = document.getElementById("mensaje");
        
        btn.disabled = true;
        btn.innerText = "Procesando e Inspeccionando...";
        mensajeDiv.style.color = "#004085";
        mensajeDiv.innerText = "Guardando cabecera de inspección...";

        try {
            const bodegaVal = document.getElementById("bodega").value.trim().toUpperCase();

            // A. Insertar cabecera en PO_INSPECCIONES
            const { data: inspeccionData, error: inspeccionError } = await supabaseClient
                .from('PO_INSPECCIONES')
                .insert([{ BODEGA: bodegaVal, fecha: new Date().toISOString() }])
                .select();

            if (inspeccionError) throw new Error("Error al guardar inspección: " + inspeccionError.message);

            const inspeccionId = inspeccionData[0].id;
            mensajeDiv.innerText = "Subiendo fotos y registrando resultados...";

            const listaResultados = [];

            // B. Recorrer cada parámetro, subir foto (si existe) y guardar en PO_RESULTADOS
            for (let i = 0; i < parametros.length; i++) {
                const estadoVal = document.getElementById(`estado_${i}`).value;
                const fileInput = document.getElementById(`foto_${i}`);

                // Subir foto si adjuntó una
                const urlFoto = await subirFoto(fileInput, inspeccionId, i);

                const resultadoObj = {
                    id_inspeccion: inspeccionId,
                    parametro: parametros[i],
                    estado: estadoVal,
                    foto_url: urlFoto
                };

                listaResultados.push(resultadoObj);
            }

            // C. Insertar todos los resultados en lote
            const { error: resultadosError } = await supabaseClient
                .from('PO_RESULTADOS')
                .insert(listaResultados);

            if (resultadosError) throw new Error("Error al guardar resultados: " + resultadosError.message);

            mensajeDiv.innerText = "Enviando datos para generar carpeta en OneDrive y PDF...";

            // D. Notificar a Power Automate para crear Carpeta y PDF
            if (POWER_AUTOMATE_WEBHOOK_URL && POWER_AUTOMATE_WEBHOOK_URL !== "AQUI_VA_TU_URL_DE_POWER_AUTOMATE") {
                await fetch(POWER_AUTOMATE_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        inspeccion_id: inspeccionId,
                        bodega: bodegaVal,
                        fecha: new Date().toLocaleDateString('es-ES'),
                        resultados: listaResultados
                    })
                });
            }

            mensajeDiv.style.color = "#28a745";
            mensajeDiv.innerText = "¡Inspección guardada y procesada con éxito!";
            document.getElementById("formInspeccion").reset();

        } catch (err) {
            console.error(err);
            mensajeDiv.style.color = "#dc3545";
            mensajeDiv.innerText = "Ocurrió un error: " + err.message;
        } finally {
            btn.disabled = false;
            btn.innerText = "Finalizar e Imprimir Informe";
        }
    });
</script>

</body>
</html>
