<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Check List de Inspección de Seguridad</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #222;
}

.app {
    width: 100%;
    max-width: 600px;
    margin: auto;
    min-height: 100vh;
    background: white;
}

header {
    background: #1f2937;
    color: white;
    padding: 22px 18px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
    line-height: 1.3;
}

.contenido {
    padding: 20px;
}

h2 {
    margin-top: 0;
}

h3 {
    margin-top: 25px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input,
textarea,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    margin-bottom: 18px;
    background: white;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
}

button:active {
    transform: scale(0.99);
}

.btn-principal {
    background: #2563eb;
    color: white;
}

.btn-secundario {
    background: #e5e7eb;
    color: #111827;
}

.btn-ticket {
    background: #111827;
    color: white;
}

.estados {
    display: grid;
    gap: 12px;
}

.estado {
    padding: 18px;
    border: 2px solid #ddd;
    border-radius: 10px;
    background: white;
    font-size: 17px;
    font-weight: bold;
}

.estado.seleccionado {
    border-color: #2563eb;
    background: #eff6ff;
}

.parametro {
    font-size: 21px;
    font-weight: bold;
    line-height: 1.4;
    margin: 20px 0 25px;
}

.contador {
    text-align: center;
    color: #666;
    margin-bottom: 10px;
    font-weight: bold;
}

.ticket {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 14px;
    margin-top: 12px;
    background: #fafafa;
}

.ticket strong {
    display: block;
    margin-bottom: 8px;
}

.ticket p {
    margin: 7px 0;
}

.acciones {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 20px;
}

.mensaje {
    padding: 15px;
    border-radius: 8px;
    margin-top: 15px;
    background: #ecfdf5;
    color: #065f46;
}

.estado-conexion {
    text-align: center;
    font-size: 13px;
    color: #666;
    margin-top: 10px;
}

.oculto {
    display: none !important;
}

hr {
    border: 0;
    border-top: 1px solid #ddd;
    margin: 25px 0;
}

.cargando {
    text-align: center;
    padding: 20px;
    color: #666;
}

</style>

</head>


<body>

<div class="app">

<header>

<h1>
CHECK LIST DE INSPECCIÓN DE SEGURIDAD
</h1>

</header>


<div class="contenido">


<!-- ================================================= -->
<!-- PANTALLA INICIAL -->
<!-- ================================================= -->

<section id="pantallaInicio">

<h2>Nueva inspección</h2>


<label>
Fecha de inspección
</label>

<input
    type="date"
    id="fechaInspeccion"
>


<label>
Hora de inspección
</label>

<input
    type="time"
    id="horaInspeccion"
>


<label>
Bodega
</label>

<input
    type="text"
    id="bodega"
    placeholder="Ingrese la bodega"
>


<label>
Nombre del inspector
</label>

<input
    type="text"
    id="inspector"
    placeholder="Ingrese el nombre del inspector"
>


<label>
Nombre del regente o encargado del área
</label>

<input
    type="text"
    id="regente"
    placeholder="Ingrese el nombre del regente o encargado"
>


<button
    type="button"
    class="btn-principal"
    id="btnIniciar"
>
INICIAR INSPECCIÓN
</button>


<div
    id="estadoConexion"
    class="estado-conexion"
>
Conectando con la base de datos...
</div>

</section>



<!-- ================================================= -->
<!-- PANTALLA DE PARÁMETROS -->
<!-- ================================================= -->

<section
    id="pantallaParametros"
    class="oculto"
>


<div
    id="contador"
    class="contador"
></div>


<div
    id="nombreParametro"
    class="parametro"
></div>


<label>
Estado
</label>


<div class="estados">


<button
    type="button"
    class="estado"
    id="btnCumple"
>
🟢 CUMPLE
</button>


<button
    type="button"
    class="estado"
    id="btnNoCumple"
>
🔴 NO CUMPLE
</button>


<button
    type="button"
    class="estado"
    id="btnNoAplica"
>
🟡 NO APLICA
</button>


</div>



<h3>
Tickets
</h3>


<div id="listaTickets"></div>


<button
    type="button"
    class="btn-ticket"
    id="btnAgregarTicket"
>
+ AGREGAR TICKET
</button>



<!-- ================================================= -->
<!-- FORMULARIO TICKET -->
<!-- ================================================= -->

<div
    id="formularioTicket"
    class="oculto"
>

<hr>

<h3>
Nuevo ticket
</h3>


<label>
Observación
</label>

<select
    id="ticketObservacion"
>

<option value="">
Seleccione una observación
</option>

</select>


<label>
Descripción
</label>

<textarea
    id="ticketDescripcion"
    placeholder="Escriba la descripción del ticket"
></textarea>


<label>
Número de ticket
</label>

<input
    type="text"
    id="ticketNumero"
    placeholder="Ejemplo: STT-36816"
>


<label>
Fecha de solicitud
</label>

<input
    type="date"
    id="ticketFecha"
>


<button
    type="button"
    class="btn-principal"
    id="btnGuardarTicket"
>
GUARDAR TICKET
</button>


<button
    type="button"
    class="btn-secundario"
    id="btnCancelarTicket"
>
CANCELAR
</button>


</div>



<div class="acciones">


<button
    type="button"
    class="btn-secundario"
    id="btnAnterior"
>
← ANTERIOR
</button>


<button
    type="button"
    class="btn-principal"
    id="btnSiguiente"
>
SIGUIENTE →
</button>


</div>


</section>



<!-- ================================================= -->
<!-- PANTALLA FINAL -->
<!-- ================================================= -->

<section
    id="pantallaFinal"
    class="oculto"
>

<h2>
Inspección terminada
</h2>


<div class="mensaje">

La inspección fue completada correctamente.

</div>


<button
    type="button"
    class="btn-principal"
    id="btnNuevaInspeccion"
>
NUEVA INSPECCIÓN
</button>

</section>


</div>

</div>



<!-- ================================================= -->
<!-- SUPABASE -->
<!-- ================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* =====================================================
   CONFIGURACIÓN SUPABASE
   ===================================================== */

const SUPABASE_URL =
    "https://yexzuexynewloljdaxme.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_xCwUcWg4FoZ57UCw91KCLg_3HPv5kPs";


/* =====================================================
   CLIENTE SUPABASE
   ===================================================== */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


window.supabaseClient =
    supabaseClient;


/* =====================================================
   PARÁMETROS DE RESPALDO
   ===================================================== */

const parametrosRespaldo = [

    "Letreros luminosos en funcionamiento, visibles y sin obstáculos",

    "Sistema Din-Dong",

    "Pantalla TV check-out",

    "CCTV operando y con adecuada cobertura",

    "Sistema de alarma y botones de pánico operando",

    "Parqueo expedito",

    "Cerraduras en funcionamiento",

    "Acera despejada y limpia",

    "Entorno iluminado y seguro",

    "Puertas y cortinas operando",

    "Anclaje zona botiquín",

    "Anclaje cajas registradoras",

    "Orden y limpieza",

    "Señalética visible y clara",

    "Extintores",

    "Basureros",

    "Procedimientos Generales de la Corporación"

];


/* =====================================================
   VARIABLES
   ===================================================== */

let parametros = [];

let indiceParametro = 0;

let estadoActual = null;

let inspeccion = {

    fecha: "",

    hora: "",

    bodega: "",

    inspector: "",

    regente: "",

    resultados: [],

    tickets: []

};


/* =====================================================
   FUNCIONES AUXILIARES
   ===================================================== */

function obtener(id) {

    return document.getElementById(id);

}


function fechaHoy() {

    const ahora = new Date();

    return ahora.toISOString().split("T")[0];

}


function horaActual() {

    const ahora = new Date();

    return ahora.toTimeString().slice(0,5);

}


/* =====================================================
   FECHA Y HORA
   ===================================================== */

obtener("fechaInspeccion").value =
    fechaHoy();

obtener("horaInspeccion").value =
    horaActual();

obtener("ticketFecha").value =
    fechaHoy();


/* =====================================================
   CARGAR PARÁMETROS
   ===================================================== */

async function cargarParametros() {

    console.log("PROBANDO CONEXIÓN CON SUPABASE...");

    try {

        const { data, error } = await supabaseClient
            .from("parametros")
            .select("*");

        console.log("DATOS DE SUPABASE:", data);
        console.log("ERROR DE SUPABASE:", error);

        if (error) {

            console.error(
                "ERROR CARGANDO PARAMETROS:",
                error
            );

            parametros = parametrosRespaldo;

            obtener("estadoConexion").innerText =
                "⚠️ Se utilizará la lista de respaldo.";

            return;
        }

        if (!data || data.length === 0) {

            console.warn(
                "Supabase respondió correctamente, pero no devolvió registros."
            );

            parametros = parametrosRespaldo;

            obtener("estadoConexion").innerText =
                "⚠️ No hay parámetros en Supabase.";

            return;
        }

        /*
         * Buscamos automáticamente el campo que contiene
         * el nombre del parámetro.
         */

        parametros = data
            .map(fila => {

                return (
                    fila.parametro ??
                    fila.nombre_parametro ??
                    fila.nombre ??
                    fila.descripcion ??
                    null
                );

            })
            .filter(valor => valor !== null && valor !== "");

        
        console.log(
            "PARAMETROS RECIBIDOS:",
            parametros
        );

        console.log(
            "CANTIDAD:",
            parametros.length
        );


        /*
         * Si por alguna razón el nombre de la columna
         * no coincide, usamos la lista de respaldo.
         */

        if (parametros.length === 0) {

            console.warn(
                "No se encontró una columna reconocible para el nombre del parámetro."
            );

            parametros = parametrosRespaldo;

        }


        obtener("estadoConexion").innerText =
            "✓ Conectado a la base de datos";


    } catch (error) {

        console.error(
            "ERROR GENERAL:",
            error
        );

        parametros =
            parametrosRespaldo;

        obtener("estadoConexion").innerText =
            "⚠️ Error de conexión. Se utilizará la lista de respaldo.";

    }

}

        if (
            data &&
            data.length > 0
        ) {

            parametros =
                data.map(
                    fila => fila.parametro
                );

        } else {

            parametros =
                parametrosRespaldo;

        }


        console.log(
            "CONEXIÓN CORRECTA"
        );

        console.log(
            "PARÁMETROS RECIBIDOS:",
            parametros
        );

        console.log(
            "CANTIDAD:",
            parametros.length
        );


        obtener("estadoConexion").innerText =
            "✓ Conectado a Supabase";


    } catch (error) {

        console.error(
            "Error general:",
            error
        );

        parametros =
            parametrosRespaldo;

        obtener("estadoConexion").innerText =
            "⚠️ Error de conexión. Se utilizará la lista guardada.";

    }

}


/* =====================================================
   INICIAR INSPECCIÓN
   ===================================================== */

function iniciarInspeccion() {

    const fecha =
        obtener(
            "fechaInspeccion"
        ).value;

    const hora =
        obtener(
            "horaInspeccion"
        ).value;

    const bodega =
        obtener(
            "bodega"
        ).value.trim();

    const inspector =
        obtener(
            "inspector"
        ).value.trim();

    const regente =
        obtener(
            "regente"
        ).value.trim();


    if (!fecha) {

        alert(
            "Ingrese la fecha de inspección."
        );

        return;

    }


    if (!hora) {

        alert(
            "Ingrese la hora de inspección."
        );

        return;

    }


    if (!bodega) {

        alert(
            "Ingrese la bodega."
        );

        return;

    }


    if (!inspector) {

        alert(
            "Ingrese el nombre del inspector."
        );

        return;

    }


    if (!regente) {

        alert(
            "Ingrese el nombre del regente o encargado del área."
        );

        return;

    }


    if (
        !parametros ||
        parametros.length === 0
    ) {

        alert(
            "Todavía no se han cargado los parámetros."
        );

        return;

    }


    inspeccion = {

        fecha: fecha,

        hora: hora,

        bodega: bodega,

        inspector: inspector,

        regente: regente,

        resultados: [],

        tickets: []

    };


    indiceParametro = 0;

    estadoActual = null;


    obtener(
        "pantallaInicio"
    ).classList.add(
        "oculto"
    );


    obtener(
        "pantallaFinal"
    ).classList.add(
        "oculto"
    );


    obtener(
        "pantallaParametros"
    ).classList.remove(
        "oculto"
    );


    mostrarParametro();

}


/* =====================================================
   MOSTRAR PARÁMETRO
   ===================================================== */

function mostrarParametro() {

    if (
        parametros.length === 0
    ) {

        return;

    }


    const parametro =
        parametros[indiceParametro];


    obtener(
        "contador"
    ).innerText =

        "PARÁMETRO " +
        (indiceParametro + 1) +
        " DE " +
        parametros.length;


    obtener(
        "nombreParametro"
    ).innerText =
        parametro;


    const resultado =
        inspeccion.resultados.find(
            r =>
                r.parametro ===
                parametro
        );


    estadoActual =
        resultado
            ? resultado.estado
            : null;


    actualizarBotones();

    mostrarTickets();

    ocultarFormularioTicket();

}


/* =====================================================
   SELECCIONAR ESTADO
   ===================================================== */

function seleccionarEstado(
    estado
) {

    estadoActual =
        estado;


    const parametro =
        parametros[indiceParametro];


    const existente =
        inspeccion.resultados.find(
            r =>
                r.parametro ===
                parametro
        );


    if (existente) {

        existente.estado =
            estado;

    } else {

        inspeccion.resultados.push({

            parametro:
                parametro,

            estado:
                estado

        });

    }


    actualizarBotones();

}


/* =====================================================
   ACTUALIZAR BOTONES DE ESTADO
   ===================================================== */

function actualizarBotones() {

    obtener(
        "btnCumple"
    ).classList.remove(
        "seleccionado"
    );


    obtener(
        "btnNoCumple"
    ).classList.remove(
        "seleccionado"
    );


    obtener(
        "btnNoAplica"
    ).classList.remove(
        "seleccionado"
    );


    if (
        estadoActual ===
        "Cumple"
    ) {

        obtener(
            "btnCumple"
        ).classList.add(
            "seleccionado"
        );

    }


    if (
        estadoActual ===
        "No Cumple"
    ) {

        obtener(
            "btnNoCumple"
        ).classList.add(
            "seleccionado"
        );

    }


    if (
        estadoActual ===
        "No Aplica"
    ) {

        obtener(
            "btnNoAplica"
        ).classList.add(
            "seleccionado"
        );

    }

}


/* =====================================================
   SIGUIENTE PARÁMETRO
   ===================================================== */

function siguienteParametro() {

    if (!estadoActual) {

        alert(
            "Seleccione el estado del parámetro."
        );

        return;

    }


    if (
        indiceParametro <
        parametros.length - 1
    ) {

        indiceParametro++;

        mostrarParametro();

    } else {

        finalizarInspeccion();

    }

}


/* =====================================================
   ANTERIOR PARÁMETRO
   ===================================================== */

function anteriorParametro() {

    if (
        indiceParametro > 0
    ) {

        indiceParametro--;

        mostrarParametro();

    }

}


/* =====================================================
   MOSTRAR FORMULARIO TICKET
   ===================================================== */

function mostrarFormularioTicket() {

    cargarObservaciones();


    obtener(
        "ticketFecha"
    ).value =
        fechaHoy();


    obtener(
        "formularioTicket"
    ).classList.remove(
        "oculto"
    );

}


/* =====================================================
   OCULTAR FORMULARIO TICKET
   ===================================================== */

function ocultarFormularioTicket() {

    obtener(
        "formularioTicket"
    ).classList.add(
        "oculto"
    );

}


/* =====================================================
   CARGAR OBSERVACIONES
   ===================================================== */

function cargarObservaciones() {

    const select =
        obtener(
            "ticketObservacion"
        );


    select.innerHTML =
        "";


    const primera =
        document.createElement(
            "option"
        );


    primera.value =
        "";


    primera.textContent =
        "Seleccione una observación";


    select.appendChild(
        primera
    );


    parametros.forEach(
        parametro => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                parametro;


            option.textContent =
                parametro;


            select.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   GUARDAR TICKET
   ===================================================== */

function guardarTicket() {

    const observacion =
        obtener(
            "ticketObservacion"
        ).value;


    const descripcion =
        obtener(
            "ticketDescripcion"
        ).value.trim();


    const numero =
        obtener(
            "ticketNumero"
        ).value.trim();


    const fecha =
        obtener(
            "ticketFecha"
        ).value;


    if (!observacion) {

        alert(
            "Seleccione la observación."
        );

        return;

    }


    if (!descripcion) {

        alert(
            "Ingrese la descripción."
        );

        return;

    }


    if (!numero) {

        alert(
            "Ingrese el número de ticket."
        );

        return;

    }


    if (!fecha) {

        alert(
            "Ingrese la fecha de solicitud."
        );

        return;

    }


    inspeccion.tickets.push({

        parametro:
            parametros[indiceParametro],

        observacion:
            observacion,

        descripcion:
            descripcion,

        numero_ticket:
            numero,

        fecha_solicitud:
            fecha

    });


    obtener(
        "ticketObservacion"
    ).value = "";


    obtener(
        "ticketDescripcion"
    ).value = "";


    obtener(
        "ticketNumero"
    ).value = "";


    ocultarFormularioTicket();


    mostrarTickets();

}


/* =====================================================
   MOSTRAR TICKETS
   ===================================================== */

function mostrarTickets() {

    const contenedor =
        obtener(
            "listaTickets"
        );


    contenedor.innerHTML =
        "";


    const parametroActual =
        parametros[indiceParametro];


    const tickets =
        inspeccion.tickets.filter(
            ticket =>
                ticket.parametro ===
                parametroActual
        );


    if (
        tickets.length === 0
    ) {

        contenedor.innerHTML =
            "<p>No hay tickets registrados para este parámetro.</p>";

        return;

    }


    tickets.forEach(
        ticket => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "ticket";


            const titulo =
                document.createElement(
                    "strong"
                );


            titulo.textContent =
                "Ticket: " +
                ticket.numero_ticket;


            const p1 =
                document.createElement(
                    "p"
                );


            p1.innerHTML =
                "<b>Observación:</b> " +
                escaparHTML(
                    ticket.observacion
                );


            const p2 =
                document.createElement(
                    "p"
                );


            p2.innerHTML =
                "<b>Descripción:</b> " +
                escaparHTML(
                    ticket.descripcion
                );


            const p3 =
                document.createElement(
                    "p"
                );


            p3.innerHTML =
                "<b>Fecha:</b> " +
                escaparHTML(
                    ticket.fecha_solicitud
                );


            div.appendChild(
                titulo
            );

            div.appendChild(
                p1
            );

            div.appendChild(
                p2
            );

            div.appendChild(
                p3
            );


            contenedor.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   SEGURIDAD PARA TEXTO DE TICKETS
   ===================================================== */

function escaparHTML(
    texto
) {

    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   FINALIZAR
   ===================================================== */

function finalizarInspeccion() {

    console.log(
        "================================="
    );

    console.log(
        "INSPECCIÓN COMPLETA"
    );

    console.log(
        inspeccion
    );

    console.log(
        "RESULTADOS:",
        inspeccion.resultados
    );

    console.log(
        "TICKETS:",
        inspeccion.tickets
    );


    obtener(
        "pantallaParametros"
    ).classList.add(
        "oculto"
    );


    obtener(
        "pantallaFinal"
    ).classList.remove(
        "oculto"
    );

}
