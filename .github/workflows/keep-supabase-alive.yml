name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.SUPABASE_URL }}/auth/v1/health")

          echo "Código de respuesta: $response"

          if [ "$response" -eq 200 ]; then
            echo "✅ Ping exitoso - Proyecto activo"
          else
            echo "❌ Error en el ping (código $response)"
            exit 1
          fi
